<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<title>Акула в формалине · Протокол наблюдателя</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0a12;--panel:#15121f;--line:#2b2542;--txt:#ece8f7;--dim:#9b94b8;--am:#a97cff;--pink:#ff4fae;--ice:#8fd9ff;--form:#6fe3c1;--red:#ff5a6a;--yel:#ffd36b;--grn:#6fe38f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#24163d,var(--bg) 55%) fixed;color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 88px}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0 .5em;font-weight:700;letter-spacing:.02em}
h1{font-size:1.35rem;text-transform:uppercase;background:linear-gradient(90deg,var(--pink),var(--am),var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.1rem;color:var(--ice)}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.85em;color:var(--dim);letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.neon{box-shadow:0 0 0 1px #ff4fae33,0 0 22px #a97cff22}
.quote{border-left:3px solid var(--am);padding:6px 10px;margin:10px 0;color:#d9d2f2;font-style:italic}
.quote b{font-style:normal;color:var(--am)}
.quote.k{border-color:var(--pink)}.quote.k b{color:var(--pink)}
label{display:block;margin:12px 0 4px;font-weight:600}
.opt{font-style:italic;font-weight:300;font-size:.88em;color:#c4bee0}
input[type=text],input[type=number],textarea,select{width:100%;background:#0f0d18;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--am)}
.range{display:flex;gap:10px;align-items:center}.range output{min-width:2.2em;text-align:center;font-weight:700;color:var(--pink);font-size:1.2rem}
.hint{font-size:.85rem;color:var(--dim);margin:2px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--pink);flex:none}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#1d1830;color:var(--txt);padding:12px 14px;min-height:44px}
button:disabled{opacity:.35;cursor:not-allowed}
button.pri{background:linear-gradient(90deg,#7a3cff,#ff3fa4);border:0;font-weight:700;width:100%;margin-top:14px}
button.ghost{background:none;color:var(--dim)}
button.sel{border-color:var(--pink);color:var(--pink);font-weight:700}
button.danger{border-color:var(--red);color:var(--red)}
button.sos{width:100%;margin:0 0 14px;border-color:var(--pink);background:#ff4fae14;font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>button{flex:1}
.ci{width:1.25em;height:1.25em;object-fit:cover;border-radius:6px;vertical-align:-.25em}
.task{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.task .ti{font-size:1.35rem;width:1.8rem;text-align:center;flex:none}
.task .n{flex:1;min-width:0;overflow-wrap:anywhere}.task .c{font-size:.8rem;color:var(--dim)}
.task .sb{flex:none;width:44px;padding:0;font-size:1.05rem}
.blu{color:var(--ice)}.grn{color:var(--grn)}.yel{color:var(--yel)}.red{color:var(--red)}
.top{display:flex;gap:14px;align-items:center}
.jar{width:110px;flex:none}
.bar{height:8px;background:#0f0d18;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--form),var(--ice))}
.month{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.month span{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--dim)}
.month .on{background:#a97cff33;border-color:var(--am);color:var(--txt)}.month .now{outline:2px solid var(--pink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:8px}
.spark i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(0deg,var(--am),var(--pink));overflow:hidden}
.spark i.z{background:var(--line)}
.spark i.r{background:linear-gradient(0deg,#ff5a6a,#ffa0b0)}
.spark i.g{background:linear-gradient(0deg,#3fbf80,#6fe38f)}
.spark i b{display:block;font-size:.55rem;text-align:center;color:#0b0a12;font-style:normal;padding-top:1px}
.sparkl{display:flex;gap:3px;margin-top:2px}.sparkl span{flex:1;text-align:center;font-size:.55rem;color:var(--dim)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:.85rem;color:#5d5775}
.badge.on{border:1px solid var(--form);color:var(--txt);background:#6fe3c112}
.badge b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#0f0d18;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:6px}
.emo button{font-size:1.3rem;padding:0;min-height:44px;display:grid;place-items:center}.emo button.on{border-color:var(--pink);background:#ff4fae22}
.emo .ci{width:1.9rem;height:1.9rem;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
.x{background:none;border:0;color:var(--dim);padding:0 8px;min-height:44px;width:auto;flex:none;font-size:1.1rem}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.hl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #2b254255}
.hl .e{font-size:1.2rem;flex:none;width:1.6rem;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:#0f0d18;border-radius:10px;padding:8px;font-size:.85rem}.stats b{display:block;font-size:1.25rem;color:var(--form)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0a12f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--dim);font-size:.72rem;padding:8px 2px}
nav button[aria-current=true]{color:var(--pink)}
nav button span{display:block;font-size:1.25rem}
#mission{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5}
#mission[hidden],#modal[hidden]{display:none}
#modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--am);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto}
.bigxp{font:700 2.4rem ui-monospace,Consolas,monospace;text-align:center;color:var(--form);margin:6px 0}
.timer{font:700 3rem ui-monospace,Consolas,monospace;text-align:center;color:var(--form);text-shadow:0 0 18px #6fe3c166;margin:18px 0}
.first{font-size:1.15rem;padding:14px;border-radius:12px;background:#ff4fae14;border:1px solid #ff4fae55}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d1830;border:1px solid var(--am);border-radius:12px;padding:10px 14px;max-width:90vw;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1;pointer-events:auto}
.warn{background:#ff5a6a22;border:1px solid var(--red);border-radius:10px;padding:10px;margin-bottom:14px;font-size:.9rem}
.goal{display:flex;gap:8px;align-items:center;margin:6px 0}.goal.ok{color:var(--form)}
@keyframes float{50%{transform:translateY(-3px)}}.shark{animation:float 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.shark{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="mission" hidden><main id="mbody"></main></div>
<div id="modal" hidden><div class="mbox" id="mcont"></div></div>
<nav>
  <button data-tab="dossier"><span>🦈</span>Досье</button>
  <button data-tab="tasks"><span>📋</span>Задания</button>
  <button data-tab="journal"><span>🗂️</span>Журнал</button>
  <button data-tab="final"><span>🌙</span>Финал</button>
  <button data-tab="more"><span>⚙️</span>Ещё</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const D={"L": {"tasks_morning": [["v", "Утро. Хороший момент для одного небольшого дела."], ["v", "Смена открыта. Выбери, с чего начнёшь."], ["k", "Доброе утро, наблюдатель. Первое дело по плану, остальное по самочувствию."], ["k", "Утро — самое тихое время. Пользуйся."], ["k", "Не гонись за списком. Выбери одно дело — и поехали."]], "tasks_day": [["v", "День в разгаре. Выбери дело по силам."], ["v", "Отчёты ждут. Список — тоже."], ["k", "Дневная смена. Музыку на фон — и вперёд."], ["k", "Что сегодня на очереди? Только не всё сразу."], ["k", "Любое дело засчитывается. Даже самое маленькое."]], "tasks_evening": [["v", "Вечер. Подведи итог дня: хотя бы одно дело."], ["v", "К вечеру ресурс убывает. Выбирай по состоянию."], ["k", "Вечерняя смена. Тише, но по делу."], ["k", "Устала? Возьми «Разминку». Это тоже считается."], ["k", "Вечер — время для лёгких дел и хорошего трека."]], "tasks_night": [["v", "Поздно. Если дело можно отложить — отложи. Сон входит в алгоритм."], ["v", "Ночью отчёты не принимаются. Исключение — самые короткие."], ["k", "Не спишь? Давай что-нибудь совсем лёгкое и отбой."], ["k", "Ночные смены вредят наблюдателям. Одно дело — и спать."], ["k", "Сполосни чашку и баиньки. Остальное завтра."]], "start": [["v", "Алгоритм не ждёт настроения. Начни с малого — остальное по ходу."], ["v", "Мне не нужно, чтобы тебе хотелось. Мне нужно, чтобы ты сделала первый шаг."], ["v", "Один шаг. Дальше решишь по обстановке."], ["k", "Включай трек и поехали. Первые две минуты — самые паршивые."], ["k", "Не думай, просто начни. Мысли догонят на светофоре."], ["k", "Пять минут, а там само поедет. Проверено."], ["k", "Включи что-нибудь на фон. Тишина иногда мешает начать."], ["v", "Выбери самое первое движение. Оно ничего не обязывает."]], "start_hard": [["v", "Дело тяжёлое. Разбей его на шаги и возьми первый."], ["v", "Сложное не значит невыполнимое. Начни с самой лёгкой части."], ["k", "Серьёзная задача. Плейлист потяжелее — и вперёд."], ["k", "Большая работа начинается с маленького шага. Банально, но работает."], ["v", "Тяжёлое дело можно прерывать. Остановка — тоже запись."]], "start_easy": [["k", "Лёгкое дело? Тем лучше — сделай и закрой."], ["k", "Пять минут, и в журнале галочка."], ["v", "Простое дело — хороший способ разогнаться."], ["v", "Не недооценивай мелочи: из них складывается смена."], ["k", "Разминка. Размяла руки — и дальше как пойдёт."]], "start_hyg": [["v", "Гигиена — это обслуживание, а не наказание."], ["v", "Шаг первый: просто дойти до места. Остальное потом."], ["k", "Включи трек, который не хочется выключать. Время пройдёт само."], ["k", "Тёплая вода и музыка — уже половина дела."]], "start_study": [["v", "Учёба. Открой материалы, остальное по ходу."], ["v", "Не надо понимать всё сразу. Нужно открыть тетрадь."], ["k", "Лекция на фоне, ручка в руке. Погнали."], ["k", "Первую страницу писать труднее всего. Дальше легче."]], "run": [["k", "Держишься? Красиво. Продолжай в том же темпе."], ["k", "Не останавливайся на ровном месте — дальше интереснее."], ["v", "Работай. Отчёт — потом."], ["v", "Тихо и методично. Так делаются дела."], ["k", "Темп хороший. Не гони, но и не стой."], ["v", "Продолжай. Остановка допустима, если она нужна."], ["k", "Отвлеклась — вернись. Это нормально, так бывает у всех."], ["v", "Ты уже внутри дела. Это самая сложная часть."], ["k", "Трек играет, дело движется. Идеально."], ["v", "Одно движение за другим. Больше ничего не требуется."]], "full": [["v", "Сделано. Протокол принят."], ["v", "Отклонения учтены, результат засчитан. Продолжай."], ["v", "Порядок начинается с малого. Ты это подтвердила."], ["k", "Готово? Чёрт, неплохо. Только не говори Инспектору, что я похвалил."], ["k", "Красиво сделала. Инспектор сделает вид, что не впечатлён."], ["v", "Записано. Это результат, а не обещание."], ["v", "Протокол обновлён. Продолжай по возможности."], ["k", "Вот так выглядит выполненное дело. Запомни ощущение."], ["k", "Красота. Можешь выдохнуть."], ["v", "Отметка принята. Наблюдатель свободен до следующего дела."], ["k", "Сделано — значит, было возможно. Просто факт."], ["v", "Ты начала. Ты закончила. Остальное — детали."]], "full_hard": [["v", "Тяжёлое дело закрыто. Отдельная отметка в протоколе."], ["v", "Это было непросто. Я это учту."], ["k", "Серьёзная работа. Дай себе минуту отдыха, заслужила."], ["k", "Вот это размах. Инспектор даже одобрил бы вслух. Почти."], ["v", "Усилие записано. Отдохни, прежде чем браться за следующее."], ["k", "Ого, справилась с таким. Горжусь, но шёпотом."]], "full_easy": [["k", "Мелочь, а в журнале красиво."], ["v", "Простое дело сделано. Из таких складывается смена."], ["k", "Лёгкая победа — тоже победа."], ["v", "Регулярность важнее масштаба. Продолжай."], ["k", "Быстро и чисто. Мне нравится."], ["v", "Небольшое дело закрыто без потерь."]], "full_hyg": [["v", "Обслуживание проведено. Системе спокойнее."], ["k", "Свежая и готовая к делам. Чисто и без драм."], ["v", "Это важное дело, и оно сделано."], ["k", "Теперь можно и музыку погромче."]], "full_study": [["v", "Учебное дело закрыто. Знания сами не накапливаются."], ["v", "Страница за страницей. Так делаются курсы."], ["k", "Мозг поработал, пусть отдохнёт."], ["k", "Домашка — это просто очередное задание. Это закрыто."]], "full_quick": [["k", "Пара минут — и дело в журнале. Эффективно."], ["v", "Краткость засчитана. Результат есть."], ["k", "Быстрее, чем я ожидал. Хотя ожидал немного."], ["v", "Не всякое дело должно быть долгим."], ["k", "Так и надо: сделала и забыла."]], "full_long": [["v", "Долгая работа. Выносливость записана."], ["k", "Ты провела в деле целую серию. Выдохни и попей воды."], ["v", "После длительной работы нужен перерыв. Это приказ."], ["k", "Марафон! Ноги-руки на месте?"], ["v", "Время потрачено не зря. Протокол это подтверждает."]], "part": [["v", "Не закончила, но начала. Записано. Наблюдатели нужны мне целыми, а не измотанными."], ["v", "Частично — тоже результат. Остальное подождёт."], ["k", "Заглохла? Бывает даже с лучшими тачками. Заведёмся заново."], ["k", "Половина дела лучше нуля. Это математика."], ["v", "Остальное можно закончить в другой раз."], ["k", "Сделала, сколько смогла. Этого достаточно."], ["v", "Незавершённое дело — не провал, а задел."], ["k", "Лучше остановиться вовремя, чем выжать себя до дна."]], "sos": [["k", "Не можешь начать? Окей. Одна вещь, запускаем таймер и смотрим, что дальше."], ["k", "Стоп-кадр. Выдохни. Что самое маленькое можно сделать прямо сейчас?"], ["v", "Остановка — не нарушение. Выбери один шаг и сделай его."], ["v", "Просьба о помощи — рабочий инструмент. Используй его."], ["k", "Окей, без паники. Давай совсем крошечный шаг."], ["k", "Запускай дело, а там посмотришь. Таймер сам всё запишет."], ["v", "Назови самое маленькое действие. Его и выполни."], ["k", "Не обязана хотеть. Достаточно начать."]], "sosyes": [["k", "Вот и началось. Дальше легче."], ["v", "Начало положено. Продолжай, сколько сможешь."], ["k", "Видишь? Самое трудное уже позади."], ["v", "Первый шаг сделан. Остальное — по ситуации."], ["k", "Стоп-кадр сработал. Поехали."]], "sosfail": [["v", "Не вышло — записано. Это данные, а не провал. Возвращайся, когда будет ресурс."], ["k", "Бывает. Сегодня не пошло — завтра заведёмся."]], "gap": [["v", "Перерыв — не нарушение. Возвращайся, когда будет ресурс. Дело подождёт."], ["k", "Пропала? Ничего. Трек всё ещё играет, заходи."], ["v", "Ты вернулась. Этого достаточно, чтобы продолжить."], ["k", "Давно не виделись. Ничего, продолжим с любого места."], ["v", "Перерыв не обнуляет прогресс. Он сохранён."], ["k", "С возвращением. Музыку включить?"]], "rest": [["v", "Режим восстановления принят. Отдыхай. Вернёшься на алгоритм, когда будешь готова."], ["k", "Плохой день — это тоже день. Отлежись, потом вернёмся."], ["v", "Отдых — часть протокола."], ["k", "Лежать тоже надо уметь. Лежи."], ["v", "Сегодня задач нет. Восстанавливайся."], ["k", "Плохой день пройдёт. Хороший будет потом."]], "final": [["v", "Финальный отчёт. Заполни честно: мне нужна точность, а не красота."], ["v", "Ты проделала работу. Опиши её как есть."], ["k", "Последний рывок: расскажи, как оно было на самом деле."], ["k", "Анкета, не допрос. Просто напиши, что думаешь."], ["v", "Данные ценны, даже если они не в твою пользу."], ["k", "Не приукрашивай. Тут все свои."], ["v", "Смена подходит к итогу. Подведи его без спешки."], ["k", "Ответы не оцениваются, только записываются."], ["v", "Обрати внимание на то, что изменилось, и на то, что нет."], ["k", "Заполнила — и дело закрыто. Почти."]], "dossier_d1": [["v", "Первая неделя. Привыкай к форме, спешить некуда."], ["v", "Для начала достаточно одного дела в день."], ["k", "Новичок в смене? Все с чего-то начинают."], ["k", "Первые дни самые шумные. Потом станет тише."]], "dossier_d2": [["v", "Вторая неделя. Рутина складывается из повторений."], ["v", "Ты уже знаешь, как это работает. Теперь закрепляй."], ["k", "Вторая неделя — самая вязкая: новизна прошла, привычка ещё не пришла."], ["k", "Не торопись. Устойчивость важнее скорости."]], "dossier_d3": [["v", "Третья неделя. Проверь, что действительно работает именно для тебя."], ["v", "Уже видно, какие дела даются легче. Используй это."], ["k", "Третья неделя. Пора добавить что-нибудь своё."], ["k", "Видишь, как банка наполняется? Идёшь по графику."]], "dossier_d4": [["v", "Последняя неделя. Подводить итоги рано, но можно оглянуться."], ["v", "Месяц почти позади. Осталось закрепить."], ["k", "Финишная прямая. Не гони, просто не съезжай с трассы."], ["k", "Осталось немного. Дальше сама."]], "dossier_d5": [["v", "Срок смены вышел. Прогресс сохраняется, можно продолжать."], ["v", "Месяц позади. Дальше — по собственному расписанию."], ["k", "Смена закончилась, но трек можно не выключать."], ["k", "Всё, что сделано после срока, — уже по твоей воле."]], "streak": [["v", "Несколько дней подряд. Регулярность — редкий ресурс."], ["k", "Серия идёт! Не ломай ритм без нужды."], ["v", "Дни выстраиваются в цепочку. Хороший признак."], ["k", "Ты в потоке. Береги его, но если собьётся — не страшно."], ["v", "Порядок появляется там, где есть повторение."]], "rankup": [["v", "Звание повышено. Это заслужено."], ["k", "Новое звание. Носи с гордостью, но без лишней помпы."], ["v", "Допуск расширен. Отмечено в личном деле."], ["k", "Растёшь, наблюдатель. Инспектор уже в курсе."], ["v", "Новый уровень. Следующий — дальше по тому же пути."]], "cap": [["v", "Дневной лимит опыта набран. Остальные дела идут в журнал, но почти без XP. Отдохни."], ["k", "На сегодня хватит. Дела записаны, а завтра будет новый день."], ["v", "Сверх нормы очки почти не начисляются. Это забота, а не наказание."], ["k", "Не перетрудись: опыт дальше растёт медленнее, а ты — нет."]], "ach": [["v", "Достижение зафиксировано."], ["k", "Ну надо же, ещё один значок."], ["v", "Отметка в личном деле."], ["k", "Красивая вещь, заслужила."], ["v", "Достижение подтверждено протоколом."], ["k", "Копи значки. Хотя главное всё-таки дела."]]}, "BRIEF": {"1": [["v", "Неделя первая: допуск. Задача одна — приучить систему к тому, что ты приходишь."], ["k", "Первая неделя: знакомься с формой. Берись за любое дело, которое не пугает."]], "2": [["v", "Неделя вторая: смена. Закрепляем то, что получилось. Новые дела — по желанию."], ["k", "Вторая неделя: рутина. Скучно, зато работает."]], "3": [["v", "Неделя третья: проверка. Посмотри на журнал. Что даётся легче, что тяжелее?"], ["k", "Третья неделя: добавь что-то своё. Любую мелочь."]], "4": [["v", "Неделя четвёртая: итоговая. Банка почти полна, осталось не сбавлять ход."], ["k", "Последняя неделя: держись курса, и без паники."]], "5": [["v", "Срок смены вышел. Протокол ждёт финального рапорта."], ["k", "Смена окончена, но ты в игре, пока сама решаешь."]]}, "ENDS": {"0": ["Смена продлена", [["v", "Срок смены истёк. Порог не набран. Я ожидал этого не от тебя, а в принципе: далеко не каждая смена закрывается в срок."], ["k", "Погоди, это что, плохая новость? Это даже не новость. Это продление."], ["v", "Продление оформлено. Все записи сохранены, банка остаётся на том уровне, который ты наполнила."], ["k", "Видишь отметку? Это не провал. Это точка, откуда стартуем."], ["v", "В протоколе нет слова «опоздала». Есть слово «продолжение»."]]], "1": ["Протокол закрыт", [["v", "Порог пройден. Протокол № 7-Д закрыт."], ["k", "Банка полна! Инспектор, вы видели? Видел, просто делает вид, что нет."], ["v", "За смену ты набрала нужный опыт и довела дела до записи в протоколе. Это внесено в личное дело."], ["k", "Знаешь, что самое классное? Банку наполнила ты сама, а не кто-то за тебя."], ["v", "Допуск подтверждён. Дальше — на твоё усмотрение."]]], "2": ["Допуск расширен", [["v", "Протокол закрыт, и закрыт шире, чем предполагалось. Ты работала в разных направлениях."], ["k", "Смотри, что в твоём списке: {cats}. Столько разных направлений за одну смену — это круто."], ["v", "Допуск расширен. Теперь ты вправе сама выбирать, где и когда работать."], ["k", "А я говорил, что получится. Ну, думал про себя."], ["v", "Отметка в досье: «Способна распределять усилия»."]]], "3": ["Своя смена", [["v", "Протокол закрыт, допуск расширен. И ещё: ты делала это регулярно."], ["k", "Не меньше половины месяца в строю. Это не случайность."], ["v", "Такая смена не требует надзора. Расписание теперь составляешь ты."], ["k", "То есть мы с Инспектором безработные? Прекрасно. Я пойду танцевать."], ["v", "Дело № 7-Д передаётся тебе. Продолжай по своему алгоритму."]]]}};

function fresh(){return{v:5,name:'',greeted:false,start:null,quest:{start:null},cats:DEF_CATS.map(c=>({...c})),tasks:Object.keys(OLDT).map(id=>({id,name:OLDT[id][0],cat:'home',lvl:OLDT[id][1],first:OLDT[id][2],icon:''})),logs:[],end:null,active:null,sos:[],lines:[],voices:{v:true,k:true},seen:{t:[]},lastBackup:null,ach:{},lvlHist:[],diary:[],trash:[],pro:null}}
function fill(s){const f=fresh();for(const k in f)if(s[k]===undefined||(s[k]===null&&!['start','end','active','lastBackup','pro'].includes(k)))s[k]=f[k];if(!s.quest)s.quest={start:null};if(!s.seen.t)s.seen={t:[]};
 s.cats.forEach(c=>{if(c.icon==='🐈')c.icon='img:cat'});s.tasks.forEach(t=>{if(t.icon==='🐈')t.icon='img:cat'});
 s.voices={v:true,k:true};s.v=5;return s}
function proFrom(o){if(!o||!Array.isArray(o.logs)||!o.logs.length)return null;
 return{name:o.name||'',start:o.start||null,end:o.end||null,logs:o.logs.map(l=>{const t=OLDT[l.task]||['Дело',2,''];return{id:l.id,ts:l.ts,task:l.task,tname:t[0],cat:'home',cname:'Быт',lvl:t[1],min:l.min||0,before:l.before,bw:l.bw||'',after:l.after,done:l.done,intr:l.intr||[],note:l.note||'',lecture:l.lecture||'',first:l.first||''}})}}

function lineFrom(base,spec,ck){spec=spec||[];ck=ck||base;
 const own=c=>(LINES[c]||[]).concat(S.lines.filter(x=>x.ctx===c).map(x=>[x.who,x.text]));
 let pools=[own(base)];if(ck!==base)pools[0]=pools[0].concat(S.lines.filter(x=>x.ctx===ck).map(x=>[x.who,x.text]));
 const sp=spec.map(c=>LINES[c]||[]).filter(p=>p.length);
 let pool=pools[0].concat(...sp);if(sp.length&&Math.random()<.5)pool=[].concat(...sp);
 if(!pool.length)return null;
 let f=pool.filter(p=>!S.seen.t.includes(p[1]));if(!f.length)f=pool;const p=pick(f);S.seen.t.push(p[1]);S.seen.t=S.seen.t.slice(-90);return p}

function xpMap(){const m={},w={},seen={},first={},ds={};WHY=w;
 [...S.logs].sort((a,b)=>a.ts-b.ts).forEach(l=>{const d=dayKey(l.ts);let x;const notes=[];
  if(l.type==='rest'){x=first[d+'r']?0:3;first[d+'r']=1;if(!x)notes.push('режим восстановления за день уже засчитан')}
  else{x=LV[l.lvl].xp;if(!l.done){x=Math.ceil(x/2);notes.push('частично — половина опыта')}
   const k=d+'|'+(l.task||l.tname);seen[k]=(seen[k]||0)+1;
   if(seen[k]===2){x=Math.ceil(x/2);notes.push('повтор того же дела за день — половина')}else if(seen[k]>2){x=Math.min(x,2);notes.push('то же дело больше двух раз за день — по 2 XP')}

 S.end={date:dayKey(Date.now()),ease:+val('fe'),now:+val('fn'),exp:val('f6'),att:val('f1'),feel:val('f2'),quar:q.value,words:val('f3'),note:val('f4'),extra:val('f5')};save();toast('Рапорт принят.')}

function more(){
 const cs=S.cats.map(c=>{const ts=S.tasks.filter(t=>t.cat===c.id);return`<div class="card"><div class="row"><h2 style="flex:3;margin:0">${ico(c.icon)} ${esc(c.name)}</h2><button onclick="renameCat('${c.id}')" aria-label="Переименовать категорию">✎</button><button class="${c.locked?'sel':''}" onclick="lockCat('${c.id}')" title="${c.locked?'Снять защиту от удаления':'Защитить от удаления'}" aria-label="${c.locked?'Снять защиту от удаления':'Защитить от удаления'}">${c.locked?'🔒':'🔓'}</button><button onclick="delCat('${c.id}')" ${c.locked?'disabled':''} title="${c.locked?'Категория защищена от удаления':'Удалить категорию'}" aria-label="Удалить категорию">🗑</button></div>
 ${c.locked?'<p class="hint">🔒 Категория защищена от удаления. Нажми замок ещё раз, чтобы снять защиту.</p>':''}
 ${ts.map(t=>`<div class="rowl"><span>${t.icon?ico(t.icon):LV[t.lvl].e} ${esc(t.name)} <span class="hint">${LV[t.lvl].n}</span></span><span><button class="x" onclick="openLvl('${t.id}')" aria-label="Название и сложность">⇅</button><button class="x" onclick="delTask('${t.id}')" aria-label="Удалить дело">🗑</button></span></div>`).join('')||'<p class="hint">Пока нет дел</p>'}</div>`}).join('');
 const cl=S.lines.map((x,i)=>`<div class="rowl"><span><b>${who(x.who)}</b> · <span class="hint">${esc(CTXN[x.ctx]||x.ctx)}</span><br>${esc(x.text)}</span><button class="x" onclick="delLine(${i})" aria-label="Удалить реплику">🗑</button></div>`).join('')||'<p class="hint">Своих реплик пока нет.</p>';
 const KN={log:'Запись о деле',task:'Дело',cat:'Категория',diary:'Запись дневника'};
 const tr=[...S.trash].sort((a,b)=>b.ts-a.ts).map(t=>{const d=t.data;const nm=t.kind==='log'?(d.tname||'—')+' · '+fmt(d.ts):t.kind==='task'?d.name:t.kind==='cat'?d.cat.name+' ('+d.tasks.length+' дел)':d.text.slice(0,40);return`<div class="rowl"><span><span class="hint">${KN[t.kind]}</span><br>${esc(nm)}</span><span><button onclick="restore('${t.id}')">Вернуть</button><button class="x" onclick="purge('${t.id}')" aria-label="Удалить навсегда">✕</button></span></div>`}).join('')||'<p class="hint">Корзина пуста.</p>';
 return`<h1>Ещё</h1><h2>Категории и дела</h2><p class="hint">⇅ у дела — изменить название и сложность. 🔓/🔒 у категории — защита от удаления.</p>${cs}<div class="row"><button onclick="openNewCat()">+ Категория</button><button onclick="openNewTask('${S.cats[0]?S.cats[0].id:''}')">+ Дело</button></div>
 <h2 style="margin-top:22px">Реплики</h2><div class="card"><h3>Добавить свою реплику</h3><label for="lc">Когда звучит</label><select id="lc">${Object.keys(CTXN).map(k=>`<option value="${k}">${CTXN[k]}</option>`).join('')}</select><label for="lw">Кто говорит</label><select id="lw"><option value="v">Инспектор Войд</option><option value="k">Кавински</option></select><label for="lt">Текст</label><input type="text" id="lt" maxlength="200"><button class="pri" onclick="addLine()">Добавить</button><h3 style="margin-top:16px">Твои реплики</h3>${cl}</div>
 <h2 style="margin-top:22px">Корзина</h2><div class="card">${tr}</div>
 <h2 style="margin-top:22px">Данные</h2><div class="card"><p class="hint">Данные хранятся только в этом браузере. Скачай копию, особенно перед сменой телефона или очисткой браузера.${S.lastBackup?' Последняя копия: '+fmt(S.lastBackup)+'.':''}</p>
 <div class="row"><button onclick="doExport('json')">⬇ Копия (JSON)</button><button onclick="doExport('csv')">⬇ Таблица (CSV)</button><button onclick="doExport('txt')">⬇ Отчёт (TXT)</button></div>
 <p class="hint">Если файл не скачался, после нажатия появятся кнопки «Поделиться», «Скопировать текст» и «Показать текст».</p>
 <label for="imp">Загрузить копию (JSON)</label><input type="file" id="imp" accept=".json,application/json" onchange="imp(this)">
 <button class="danger" style="width:100%;margin-top:16px" onclick="resetAll()">Стереть все данные</button></div>`;
}
function renameCat(id){const c=cat(id);modalCb=()=>{const n=val('mv');if(n){c.name=n.slice(0,40);S.logs.forEach(l=>{if(l.cat===id)l.cname=c.name});save()}};
 modal(`<h2>Название категории</h2><input type="text" id="mv" maxlength="40" value="${esc(c.name)}"><div class="row" style="margin-top:12px"><button onclick="closeModal()">Отмена</button><button class="pri" style="margin:0;width:auto" onclick="modalOk()">Сохранить</button></div>`)}
function lockCat(id){const c=cat(id);if(!c)return;c.locked=!c.locked;save();toast(c.locked?'Категория защищена от удаления.':'Защита снята, категорию можно удалить.')}
function delCat(id){const c=cat(id);if(!c)return;if(c.locked){toast('Категория защищена от удаления. Нажми замок 🔒, чтобы снять защиту.');return}
 const ts=S.tasks.filter(t=>t.cat===id);
 ask(ts.length?`Удалить категорию «${c.name}» вместе с делами (${ts.length})? Записи в журнале сохранятся. Всё можно вернуть из корзины.`:`Удалить категорию «${c.name}»? Её можно будет вернуть из корзины.`,'Удалить',()=>{
  S.trash.push({id:uid(),kind:'cat',ts:Date.now(),data:{cat:c,tasks:ts}});S.tasks=S.tasks.filter(t=>t.cat!==id);S.cats=S.cats.filter(x=>x.id!==id);save();toast('Удалено. Вернуть можно в корзине.')},true)}
function delTask(id){const t=task(id);ask(`Удалить дело «${t.name}» из списка? Записи в журнале сохранятся. Дело можно вернуть из корзины.`,'Удалить',()=>{
 S.trash.push({id:uid(),kind:'task',ts:Date.now(),data:t});S.tasks=S.tasks.filter(x=>x.id!==id);save();toast('Удалено. Вернуть можно в корзине.')},true)}
function restore(id){const t=S.trash.find(x=>x.id===id);if(!t)return;
 if(t.kind==='log')S.logs.push(t.data);
 if(t.kind==='diary')S.diary.push(t.data);
 if(t.kind==='cat'){if(!cat(t.data.cat.id))S.cats.push(t.data.cat);t.data.tasks.forEach(x=>{if(!task(x.id))S.tasks.push(x)})}
 if(t.kind==='task'){if(!cat(t.data.cat))S.cats.push({id:t.data.cat,name:'Восстановленная категория',icon:'📌'});if(!task(t.data.id))S.tasks.push(t.data)}
 S.trash=S.trash.filter(x=>x.id!==id);save();toast('Возвращено')}
function purge(id){ask('Удалить навсегда? Вернуть будет нельзя.','Удалить навсегда',()=>{S.trash=S.trash.filter(x=>x.id!==id);save()},true)}
function addLine(){const t=val('lt');if(!t){toast('Напиши текст реплики');return}S.lines.push({ctx:val('lc'),who:val('lw'),text:t});save();toast('Реплика добавлена')}
function delLine(i){S.lines.splice(i,1);save()}

function logLine(l){const t=new Date(l.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
 if(l.type==='rest')return`• ${t} — режим восстановления.`;
 return`• ${t} — [${l.cname}] ${l.tname} (${LV[l.lvl].n}), ${l.min||0} мин.${l.want!=null?' Хотелось начать (до): '+l.want+'/10.':''}${l.resist!=null?' Не хотелось начинать (после): '+l.resist+'/10.':''}${l.before!=null?' Самочувствие '+l.before+' → '+l.after+'.':(l.after!=null?' Самочувствие после: '+l.after+'.':'')} ${l.done?'Полностью':'Частично'}.${l.quick?' (запись постфактум)':''}${l.first?' Первый шаг: '+l.first+'.':''}${l.lecture?' Фон: '+l.lecture+'.':''}${(l.intr||[]).length?' Помехи: '+l.intr.join('; ')+'.':''}${l.note?' '+l.note:''}`}
function dayLines(logs,base){const by={};logs.forEach(l=>(by[dayKey(l.ts)]??=[]).push(l));const r=[];
 Object.keys(by).sort().forEach(k=>{r.push('',`ДЕНЬ ${Math.round((new Date(k)-new Date(base))/864e5)+1} — ${ruDate(k)} (записей: ${by[k].length})`);by[k].sort((a,b)=>a.ts-b.ts).forEach(l=>r.push(logLine(l)))});return r}
function report(){
 const s=stats(),E=S.end,r=[`ПРОТОКОЛ НАБЛЮДЕНИЯ — «Дела без прокрастинации»`,`Наблюдатель: ${S.name||'—'}`,''];
 if(S.pro){const P=S.pro,ps=statsOf(P.logs);r.push('ПРОЛОГ (пробная неделя, вне зачёта смены):',`Дел: ${ps.n}, дней: ${ps.days}, минут: ${ps.min}, доведено до конца: ${ps.full}%.`);
  if(P.start)r.push(`Старт: ${ruDate(P.start.date)}, лёгкость скучных дел ${P.start.ease}/10.${P.start.note?' '+P.start.note:''}`);
  r.push(...dayLines(P.logs,P.start?P.start.date:dayKey(P.logs[0].ts)));
  if(P.end)r.push('',`Финал пролога: лёгкость ${P.end.ease}/10. Родители: ${P.end.att||'—'}. С родителями: ${P.end.feel||'—'}. Ссор: ${P.end.quar||'—'}. Слова: ${P.end.words||'—'}. Помогало/мешало: ${P.end.note||'—'}.`);
  r.push('','========== СМЕНА ==========','')}
 if(S.start)r.push(`Старт: ${ruDate(S.start.date)}. Лёгкость скучных дел: ${S.start.ease}/10.${S.start.note?' '+S.start.note:''}`);
 r.push(...dayLines(S.logs,baseDate()));
 if(s.n)r.push('',`ИТОГО: ${s.n} дел за ${s.days} дн. Доведено до конца: ${s.full}%. Всего ${s.min} мин.${s.wntN?' Среднее «хочется начать» до дела: '+s.wnt.toFixed(1)+'/10.':''}${s.resN?' Среднее «не хотелось начинать» после: '+s.res.toFixed(1)+'/10.':''}${s.aftN?' Среднее самочувствие после: '+s.aft.toFixed(1)+'.':''}`);
 const sosN=S.sos.length;if(sosN)r.push(`Кнопка «не могу начать»: запускала ${sosN} раз(а).`);
 if(S.lvlHist.length)r.push('','СМЕНЫ СЛОЖНОСТИ:',...S.lvlHist.map(h=>`• ${ruDate(dayKey(h.ts))} — ${h.tname}: ${LV[h.from].n} → ${LV[h.to].n}`));
 const got=ACH.filter(a=>S.ach[a.id]);if(got.length)r.push('','ДОСТИЖЕНИЯ: '+got.map(a=>a.n).join(', '));
 const dr=[...S.diary].filter(d=>d.share).sort((a,b)=>a.ts-b.ts);if(dr.length)r.push('','ДНЕВНИК:',...dr.map(d=>`• ${fmt(d.ts)} — ${d.text.replace(/\n+/g,' ')}`));
 if(E&&S.start)r.push('','ФИНАЛ:',`Лёгкость выполнения дел: ${S.start.ease} → ${E.ease}/10`,`Общее самочувствие в финале: ${E.now??'—'}/10`,`Мысли об эксперименте: ${E.exp||'—'}`,`Отношение родителей: ${E.att||'—'}`,`Самочувствие с родителями: ${E.feel||'—'}`,`Ссор: ${E.quar||'—'}`,`Реакция на раздражавшие слова: ${E.words||'—'}`,`Помогало/мешало: ${E.note||'—'}`,`Заметки: ${E.extra||'—'}`);
 return r.join('\n');
}
function csv(){const H=['фаза','дата','время','день_смены','тип','категория','дело','сложность','минуты','хочется_начать_до_1_10','не_хотелось_начинать_после_0_10','самочувствие_до','самочувствие_после','выполнено','помехи','первый_шаг','фон','заметка','запись_постфактум','xp'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const tm=l=>new Date(l.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
 const pro=(S.pro?S.pro.logs:[]).map(l=>['пролог',dayKey(l.ts),tm(l),'','task',l.cname,l.tname,LV[l.lvl].n,l.min||0,'','',l.before??'',l.after??'',l.done?1:0,(l.intr||[]).join(' | '),l.first,l.lecture,l.note,0,''].map(q).join(';'));
 const rows=[...S.logs].sort((a,b)=>a.ts-b.ts).map(l=>['смена',dayKey(l.ts),tm(l),dayOf(l.ts),l.type||'task',l.cname,l.tname,l.lvl?LV[l.lvl].n:'',l.min||0,l.want??'',l.resist??'',l.before??'',l.after??'',l.done?1:0,(l.intr||[]).join(' | '),l.first,l.lecture,l.note,l.quick?1:0,xpOf(l)].map(q).join(';'));
 return'\uFEFF'+[H.map(q).join(';'),...pro,...rows].join('\r\n')}

function triggerDownload(name,text,type){try{const blob=new Blob([text],{type:type+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);return true}catch(e){return false}}
function fallbackButtons(){return`<button class="pri" onclick="shareExport()">📤 Поделиться / сохранить</button><button style="width:100%;margin-top:8px" onclick="copyExport()">📋 Скопировать текст</button><button style="width:100%;margin-top:8px" onclick="showExport()">👁 Показать текст</button>`}
function deliver(name,text,type){lastExport={name,text,type};triggerDownload(name,text,type);
 modal(`<h2>${esc(name)}</h2><p class="hint">Файл должен скачаться сам. Если этого не произошло (например, страница открыта внутри Telegram), используй кнопки ниже.</p>${fallbackButtons()}<button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Закрыть</button>`)}
async function shareExport(){const e=lastExport;if(!e)return;
 try{const f=new File([e.text],e.name,{type:e.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:e.name});return}}catch(err){if(err&&err.name==='AbortError')return}
 try{if(navigator.share){await navigator.share({title:e.name,text:e.text});return}}catch(err){if(err&&err.name==='AbortError')return}
 toast('Поделиться не получилось. Нажми «Скопировать текст» или «Показать текст».')}
function copyExport(){const e=lastExport;if(!e)return;
 const ok=()=>toast('Текст скопирован. Вставь его в заметки или сообщение.');
 const fb=()=>{try{const ta=document.createElement('textarea');ta.value=e.text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const r=document.execCommand('copy');ta.remove();r?ok():toast('Не удалось скопировать. Нажми «Показать текст» и выдели вручную.')}catch(x){toast('Не удалось скопировать. Нажми «Показать текст».')}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(e.text).then(ok).catch(fb);else fb()}
function showExport(){const e=lastExport;if(!e)return;
 modal(`<h2>${esc(e.name)}</h2><textarea id="exptext" readonly style="min-height:240px;font-size:.8rem">${esc(e.text)}</textarea><div class="row" style="margin-top:10px"><button onclick="const t=document.getElementById('exptext');t.focus();t.select()">Выделить всё</button><button onclick="closeModal()">Закрыть</button></div>`)}
function doExport(kind){
 let name,text,type;const d=dayKey(Date.now());
 try{XPM=xpMap();
  if(kind==='csv'){name='akula-'+d+'.csv';text=csv();type='text/csv'}
  else if(kind==='txt'){name='otchet-'+d+'.txt';text=report();type='text/plain'}
  else{name='kopiya-'+d+'.json';text=JSON.stringify(S);type='application/json'}
 }catch(err){toast('Не получилось сформировать файл: '+(err&&err.message?err.message:err),9000);return}
 if(kind==='json'){S.lastBackup=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
 deliver(name,text,type)}
function resetAll(){
 let text;try{text=JSON.stringify(S)}catch(err){toast('Не получилось сформировать копию, стирание остановлено.');return}
 const name='kopiya-'+dayKey(Date.now())+'.json';lastExport={name,text,type:'application/json'};
 triggerDownload(name,text,'application/json');S.lastBackup=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 modal(`<h2>Сначала копия данных</h2><p>Копия <b>${esc(name)}</b> скачивается автоматически. Если файл не появился, сохрани её кнопками ниже, прежде чем стирать.</p>${fallbackButtons()}<div class="row" style="margin-top:12px"><button onclick="closeModal()">Отмена</button><button class="danger" onclick="resetConfirm()">Продолжить стирание</button></div>`)}
function resetConfirm(){ask('Точно стереть ВСЕ данные в приложении (записи, дневник, дела, достижения)? Это нельзя отменить.','Стереть всё',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=load();tab='dossier';save();toast('Данные стёрты')},true)}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result);if(!o||!Array.isArray(o.logs)||o.v!==5)throw 0}catch(e){toast('Не получилось прочитать файл: нужна копия из этой версии приложения');return}
 ask('Заменить текущие данные ('+S.logs.length+' записей) данными из файла ('+o.logs.length+')?','Заменить',()=>{S=fill(o);save();toast('Данные загружены')},true)};r.readAsText(f)}

document.getElementById('toast').onclick=()=>document.getElementById('toast').classList.remove('on');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
